name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "feature/**", "beta/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run benchmark
      - name: Check out pinned private release toolkit for trusted builds
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: wondersalmon/foundry-release-tools
          ref: ce0605457e7fe4b12ace77be224d8f9819038de2
          path: dev/release-tools
          ssh-key: ${{ secrets.RELEASE_TOOLS_SSH_KEY }}
          persist-credentials: false

      - name: Install pinned toolkit dependencies
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm ci --prefix dev/release-tools --omit=dev --ignore-scripts

      - name: Build and verify with shared toolkit
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run release:build
          npm run release:verify

      - name: Build fork package without private credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            dev/coverage/
            dev/benchmarks/
            dev/test-results/
            dev/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probably-just-a-rat-${{ github.sha }}
          path: |
            dist/module.json
            dist/probably-just-a-rat.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
