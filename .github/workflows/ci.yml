name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run benchmark
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            dev/coverage/
            dev/benchmarks/
            dev/test-results/
            dev/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probably-just-a-rat-${{ github.sha }}
          path: |
            dist/module.json
            dist/probably-just-a-rat.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
