name: GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "Expected a tag such as v0.1.0 or v0.1.0-beta.1"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version) process.exit(1)'
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run benchmark
      - run: npm run build -- --release
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CHANNEL_ARGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            CHANNEL_ARGS=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            dist/module.json dist/probably-just-a-rat.zip dist/SHA256SUMS.txt \
            --verify-tag --notes-file dist/release-notes.md \
            --title "Probably Just a Rat $RELEASE_TAG" \
            "${CHANNEL_ARGS[@]}"
